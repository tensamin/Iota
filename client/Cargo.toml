[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
mtp = { git = "https://github.com/Nonanium/MTP.git", rev = "87c535650a3a33b166139b02cdd7327d412d3bca", features = ["client", "crypto", "pipes", "web-server"] }
tau = { git = "https://github.com/TensaminDev/Tau.git", rev = "e140d4ac71fb83d4de32a108f65355cc9d52afea" }
thiserror = "2"
serde_json = "1"
tokio-util = "0.7"
iota-auth = { path = "../iota-auth" }
iota-identity = { path = "../iota-identity" }
iota-connection = { path = "../iota-connection" }
iota-logger = { path = "../iota-logger" }
iota-util = { path = "../iota-util" }
iota-storage = { path = "../iota-storage" }
other-iota = { path = "../other-iota" }
web-server = { path = "../web-server" }
dashmap = "6.1.0"
tokio = { version = "1.50.0", features = ["full"] }
uuid = { version = "*", features = ["v4"] }

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
