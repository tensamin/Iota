[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
mtp = { git = "https://github.com/Nonanium/MTP.git", rev = "db3125809293e462ec1593704e9c4d2172437533", features = ["client", "crypto", "pipes", "web-server"] }
tau = { git = "https://github.com/TensaminDev/Tau.git", rev = "57096c5341f5196ea953788ab8fd3c60ca920817" }
thiserror = "2"
serde_json = "1"
tokio-util = "0.7"
iota-auth = { path = "../iota-auth" }
iota-identity = { path = "../iota-identity" }
iota-connection = { path = "../iota-connection" }
iota-logger = { path = "../iota-logger" }
iota-util = { path = "../iota-util" }
iota-storage = { path = "../iota-storage" }
other-iota = { path = "../other-iota" }
web-server = { path = "../web-server" }
dashmap = "6.1.0"
tokio = { version = "1.50.0", features = ["full"] }
uuid = { version = "*", features = ["v4"] }

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
