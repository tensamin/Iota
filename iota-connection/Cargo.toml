[package]
name = "iota-connection"
version = "0.1.0"
edition = "2024"

[features]
relay-fault-injection = ["iota-storage/relay-fault-injection"]

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
iota-auth = { path = "../iota-auth" }
iota-identity = { path = "../iota-identity" }
iota-logger = { path = "../iota-logger" }
iota-storage = { path = "../iota-storage" }
    iota-util = { path = "../iota-util" }
mtp = { git = "https://github.com/Nonanium/MTP.git", rev = "9f7f94e4cbd227610784ae47a1e7a1acf66f8584", features = ["crypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.40.0"
tau-relay-protocol = { git = "https://github.com/TensaminDev/Tau.git", rev = "6465cd77f61e0df3316f331b6a49885864a81033" }
tau = { git = "https://github.com/TensaminDev/Tau.git", rev = "6465cd77f61e0df3316f331b6a49885864a81033" }
tokio = { version = "1.50.0", features = ["rt"] }
uuid = "1"

[dev-dependencies]
tokio = { version = "1.50.0", features = ["macros", "rt"] }
