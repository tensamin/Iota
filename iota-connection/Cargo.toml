[package]
name = "iota-connection"
version = "0.1.0"
edition = "2024"

[features]
relay-fault-injection = ["iota-storage/relay-fault-injection"]

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
iota-auth = { path = "../iota-auth" }
iota-identity = { path = "../iota-identity" }
iota-logger = { path = "../iota-logger" }
iota-storage = { path = "../iota-storage" }
    iota-util = { path = "../iota-util" }
mtp = { git = "https://github.com/Nonanium/MTP.git", rev = "db3125809293e462ec1593704e9c4d2172437533", features = ["crypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.40.0"
tau-relay-protocol = { git = "https://github.com/TensaminDev/Tau.git", rev = "57096c5341f5196ea953788ab8fd3c60ca920817" }
tau = { git = "https://github.com/TensaminDev/Tau.git", rev = "57096c5341f5196ea953788ab8fd3c60ca920817" }
tokio = { version = "1.50.0", features = ["rt"] }
uuid = "1"

[dev-dependencies]
tokio = { version = "1.50.0", features = ["macros", "rt"] }
