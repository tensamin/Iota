[package]
name = "iota-connection"
version = "0.1.0"
edition = "2024"

[features]
relay-fault-injection = ["iota-storage/relay-fault-injection"]

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
iota-auth = { path = "../iota-auth" }
iota-identity = { path = "../iota-identity" }
iota-logger = { path = "../iota-logger" }
iota-storage = { path = "../iota-storage" }
    iota-util = { path = "../iota-util" }
mtp = { git = "https://github.com/Nonanium/MTP.git", rev = "87c535650a3a33b166139b02cdd7327d412d3bca", features = ["crypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.40.0"
tau-relay-protocol = { git = "https://github.com/TensaminDev/Tau.git", rev = "cb1f5953c0f9e71c4a01688abaf8432fda3c90da" }
tau = { git = "https://github.com/TensaminDev/Tau.git", rev = "cb1f5953c0f9e71c4a01688abaf8432fda3c90da" }
tokio = { version = "1.50.0", features = ["rt"] }
uuid = "1"

[dev-dependencies]
tokio = { version = "1.50.0", features = ["macros", "rt"] }
