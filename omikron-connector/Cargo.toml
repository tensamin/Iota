[package]
name = "omikron-connector"
version = "0.1.0"
edition = "2024"

[dependencies]
iota-opaque = { path = "../iota-opaque" }
async-trait = "0.1.89"
iota-connection = { path = "../iota-connection" }
other-iota = { path = "../other-iota" }
iota-auth = { path = "../iota-auth" }
iota-identity = { path = "../iota-identity" }
iota-logger = { path = "../iota-logger" }
iota-state = { path = "../iota-state" }
iota-storage = { path = "../iota-storage" }
iota-util = { path = "../iota-util" }
mtp = { git = "https://github.com/Nonanium/MTP.git", rev = "9f7f94e4cbd227610784ae47a1e7a1acf66f8584", features = [
    "client",
    "crypto",
    "files",
    "raw",
] }

dashmap = "6.2.1"
tau = { git = "https://github.com/TensaminDev/Tau.git", rev = "6465cd77f61e0df3316f331b6a49885864a81033" }
hex = "0.4"
json = "*"
reqwest = "0.13.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "*", features = ["v4"] }
base64 = "0.22.1"
rand_core = { version = "0.6", features = ["getrandom", "std"] }
trust-dns-resolver = { version = "0.23", features = ["tokio-runtime"] }
url = "2"

[dev-dependencies]
rcgen = "0.14"
rusqlite = "0.40.0"
