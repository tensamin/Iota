[package]
name = "other-iota"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
iota-connection = { path = "../iota-connection" }
iota-identity = { path = "../iota-identity" }
iota-util = { path = "../iota-util" }
mtp = { git = "https://git.methanium.net/Methanium/mtp.git", rev = "abe39e0ea357b4516889e1502aa3356c623f7e63", features = ["client", "crypto", "pipes", "web-server"] }
reqwest = { version = "0.13", features = ["json"] }
serde = "1"
tokio = { version = "1.50.0", features = ["full"] }
web-server = { path = "../web-server" }

[dev-dependencies]
iota-storage = { path = "../iota-storage" }
rcgen = "0.14"
tempfile = "3"
