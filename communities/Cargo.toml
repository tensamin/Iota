[package]
name = "communities"
version = "0.1.0"
edition = "2024"

[dependencies]
mtp = { git = "https://git.methanium.net/Methanium/mtp.git"}
iota-util = { path = "../iota-util" }

futures = "*"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom", "std"] }
sha2 = "0.11.0"
tokio = { version = "1.50.0", features = ["full"] }
uuid = { version = "*", features = ["v4"] }
x448 = { version = "*" }
