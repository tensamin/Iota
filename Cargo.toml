[workspace]
members = [
    "iota-identity",
    "iota-storage",
    "iota-connection",
    "client",
    "iota-auth",
    "other-iota",
    "iota-updater",
    "iota-terms",
    "iota-state",
    "iota-cli",
    "iota",
    "iota-daemon",
    "iota-daemon-lib",
    "iota-ipc",
    "omikron-connector",
    "web-server",
    "web-ui",
    "iota-logger",
    "iota-util",
    "iota-process-manager",
    "iota-paths",
    "iota-installer",
    "iota-core",
    "iota-opaque",
]
exclude = ["communities"]
resolver = "3"

[patch."https://github.com/TensaminDev/Tau.git"]
tau = { path = "../tau" }
tau-relay-protocol = { path = "../tau/relay-protocol" }

[patch."https://github.com/Nonanium/MTP.git"]
mtp = { path = "../mtp" }
mtp-type-map = { path = "../mtp/type-map" }
mtp-crypto = { path = "../mtp/crypto" }
