[package]
name = "iota-util"
version = "0.1.0"
edition = "2024"

[dependencies]
iota-paths = { path = "../iota-paths" }
iota-identity = { path = "../iota-identity" }
tau = { git = "https://github.com/TensaminDev/Tau.git", rev = "714968acb05a2e877f03690028ae604afcbbc701" }
mtp = { git = "https://github.com/Nonanium/MTP.git", rev = "db3125809293e462ec1593704e9c4d2172437533", features = [
    "crypto"
] }

reqwest = { version = "0.13.2", features = ["json"] }
tokio = { version = "1.50.0", features = ["full"] }
sysinfo = "0.38.0"
uuid = { version = "*", features = ["v4"] }
walkdir = "2.5.0"
zip = "6.0.0"
base64 = "0.22.1"
hex = "*"
sha2 = "0.10"
url = "2"
serde = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
