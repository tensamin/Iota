[package]
name = "iota-util"
version = "0.1.0"
edition = "2024"

[dependencies]
iota-paths = { path = "../iota-paths" }
iota-identity = { path = "../iota-identity" }
mtp = { git = "https://git.methanium.net/Methanium/mtp.git", rev = "1f19a0d897c265d1e3f590a876f95e766ff99318", features = [
    "crypto"
] }

reqwest = { version = "0.13.2", features = ["json"] }
tokio = { version = "1.50.0", features = ["full"] }
sysinfo = "0.38.0"
uuid = { version = "*", features = ["v4"] }
walkdir = "2.5.0"
zip = "6.0.0"
base64 = "0.22.1"
hex = "*"

[dev-dependencies]
tempfile = "3"
