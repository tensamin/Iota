[package]
name = "iota-util"
version = "0.1.0"
edition = "2024"

[dependencies]
iota-paths = { path = "../iota-paths" }
iota-identity = { path = "../iota-identity" }
tau = { git = "https://github.com/TensaminDev/Tau.git", rev = "1c9df9f237e72d17752090a1bdffb7340627deae" }
mtp = { git = "https://github.com/Nonanium/MTP.git", rev = "9f7f94e4cbd227610784ae47a1e7a1acf66f8584", features = [
    "crypto"
] }

reqwest = { version = "0.13.2", features = ["json"] }
tokio = { version = "1.50.0", features = ["full"] }
sysinfo = "0.38.0"
uuid = { version = "*", features = ["v4"] }
walkdir = "2.5.0"
zip = "6.0.0"
base64 = "0.22.1"
hex = "*"
sha2 = "0.10"
url = "2"
serde = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
