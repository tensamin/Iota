[package]
name = "iota-util"
version = "0.1.0"
edition = "2024"

[dependencies]
iota-paths = { path = "../iota-paths" }
iota-identity = { path = "../iota-identity" }
mtp = { git = "https://github.com/MethaniumDev/MTP.git", rev = "ad489265deacadd6de52ed2129d071803a0e7247", features = [
    "crypto"
] }

reqwest = { version = "0.13.2", features = ["json"] }
tokio = { version = "1.50.0", features = ["full"] }
sysinfo = "0.38.0"
uuid = { version = "*", features = ["v4"] }
walkdir = "2.5.0"
zip = "6.0.0"
base64 = "0.22.1"
hex = "*"
sha2 = "0.10"
url = "2"

[dev-dependencies]
tempfile = "3"
