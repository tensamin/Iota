[package]
name = "iota-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
iota-logger = { path = "../iota-logger" }
iota-util = { path = "../iota-util" }
iota-paths = { path = "../iota-paths" }

base64 = "0.22.1"
json = "*"
arc-swap = "1"
once_cell = "1.21.3"
r2d2 = "0.8"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
rand = "0.8"
rusqlite = "0.40.0"
tokio = { version = "1.50.0", features = ["full"] }
