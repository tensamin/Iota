[package]
name = "iota-storage"
version = "0.1.0"
edition = "2024"

[features]
relay-fault-injection = []

[dependencies]
async-trait = "0.1.89"
iota-identity = { path = "../iota-identity" }
iota-logger = { path = "../iota-logger" }
iota-util = { path = "../iota-util" }
iota-paths = { path = "../iota-paths" }
iota-opaque = { path = "../iota-opaque" }
base64 = "0.22.1"
json = "*"
arc-swap = "1"
once_cell = "1.21.3"
r2d2 = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
zeroize = "1"
rand = "0.8"
rusqlite = { version = "0.40.0", features = ["backup"] }
fs2 = "0.4.3"
tokio = { version = "1.50.0", features = ["full"] }

[dev-dependencies]
mtp = { git = "https://github.com/Nonanium/MTP.git", rev = "db3125809293e462ec1593704e9c4d2172437533", features = ["crypto"] }
tempfile = "3"
