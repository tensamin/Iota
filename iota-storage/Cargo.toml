[package]
name = "iota-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
iota-identity = { path = "../iota-identity" }
iota-logger = { path = "../iota-logger" }
iota-util = { path = "../iota-util" }
iota-paths = { path = "../iota-paths" }
base64 = "0.22.1"
json = "*"
arc-swap = "1"
once_cell = "1.21.3"
r2d2 = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
rand = "0.8"
rusqlite = "0.40.0"
fs2 = "0.4.3"
tokio = { version = "1.50.0", features = ["full"] }

[dev-dependencies]
mtp = { git = "https://git.methanium.net/Methanium/mtp.git", rev = "2a2f956910ccef759e950b3e3296d8e5d6b9cddf", features = ["crypto"] }
tempfile = "3"
