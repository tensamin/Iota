[package]
name = "iota-state"
version = "0.1.0"
edition = "2024"

[features]
default = ["legacy-globals"]
legacy-globals = []

[dependencies]
dashmap = "6.1.0"
once_cell = "1.21.3"
tokio = { version = "1.50.0", features = ["full"] }
json = "*"
sysinfo = "0.39.0"
mtp = { git = "https://git.methanium.net/Methanium/mtp.git" }
serde = { version = "1", features = ["derive"] }
