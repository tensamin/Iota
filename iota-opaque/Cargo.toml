[package]
name = "iota-opaque"
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE"
publish = false

[dependencies]
opaque-ke = { version = "=4.0.1", features = ["argon2"] }
argon2 = "0.5"
generic-array = "0.14"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
zeroize = "1"
thiserror = "2"
uuid = "1"
chacha20poly1305 = "0.10"
hkdf = "0.12"

[dev-dependencies]
hex = "0.4"
serde_json = "1"
