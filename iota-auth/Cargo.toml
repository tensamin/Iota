[package]
name = "iota-auth"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
dashmap = "6.2.1"
iota-identity = { path = "../iota-identity" }
mtp = { git = "https://git.methanium.net/Methanium/mtp.git", rev = "abe39e0ea357b4516889e1502aa3356c623f7e63", features = ["crypto"] }
rand_core = { version = "0.6", features = ["getrandom", "std"] }
uuid = { version = "*", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.50.0", features = ["macros", "rt"] }
