[package]
name = "iota-cli"
version = "0.1.0"
edition = "2024"

[features]
legacy-commands = [
]

[dependencies]
iota-state = { path = "../iota-state" }
iota-terms = { path = "../iota-terms" }
iota-ipc = { path = "../iota-ipc" }
iota-paths = { path = "../iota-paths" }


chrono = "0.4.43"
crossterm = "0.29.0"
once_cell = "1.21.3"
open = "5.3.3"
ratatool = { git = "https://github.com/Nonanium/ratatool.git", rev = "ddd0ddea7235cfc1ca27f79cf166f40d3d1fdabe", features = ["tokio"] }
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
