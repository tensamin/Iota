[package]
name = "iota-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
iota-state = { path = "../iota-state" }
iota-terms = { path = "../iota-terms" }
iota-ipc = { path = "../iota-ipc" }
iota-paths = { path = "../iota-paths" }
chrono = "0.4.43"
crossterm = "*"
once_cell = "1.21.3"
open = "5.3.3"
ratatui = "0.30.0"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
